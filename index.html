      this file is served for every route, so it told all 553 URLs they were
      duplicates of the homepage — an explicit request not to be indexed. A
      missing canonical is correct behaviour (a URL is its own canonical by
      default); a wrong one is not. Per-route canonicals are injected by
      middleware.ts for crawlers and set by PageMeta for client navigation.
      Do not reinstate this line — tests/unit/headInjection.test.ts fails if
      it returns.

    <!-- Tracking opt-out guard. MUST stay above the Google and Meta snippets:
         both start collecting the moment they load, so a check that runs after
         them is a check that runs too late. Deliberately inline and dependency
         free for the same reason — it has to execute before any bundle.

         Mirrors src/lib/trackingChoice.ts, which cannot be imported here.
         The key and values are duplicated there; change both together.

         Honours Global Privacy Control as well as the stored choice, because
         California treats a GPC signal as a valid opt-out request in itself. -->
    <script>
      (function () {
        var optedOut = false;
        try { optedOut = navigator.globalPrivacyControl === true; } catch (e) {}
        try {
          if (localStorage.getItem('hql_tracking_choice') === 'opted_out') optedOut = true;
        } catch (e) { /* storage blocked; fall through to the default */ }

        window.__hqlTrackingOptedOut = optedOut;

        // Google's own kill switch, read by gtag.js when it loads. Setting it
        // here means the script may still download but collects nothing.
        if (optedOut) window['ga-disable-G-LKDJ4LMYFR'] = true;
      })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LKDJ4LMYFR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      if (!window.__hqlTrackingOptedOut) {
        gtag('config', 'G-LKDJ4LMYFR');
      }
    </script>

    <!-- Meta Pixel Code — Valley Home Pros dataset.
         Wrapped rather than flag-disabled: fbevents.js has no supported kill
         switch equivalent to ga-disable-*, so for an opted-out visitor the
         only reliable answer is never to load or initialise it at all. -->
    <script>
      if (!window.__hqlTrackingOptedOut) {
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1102708245809446');
      fbq('track', 'PageView');
      }
    </script>
    <!-- End Meta Pixel Code -->
